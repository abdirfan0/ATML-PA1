method:
  name: cdan
  uses_unlabeled_target: true
  classification_loss_weight: 1.0
  domain_loss_weight: 1.0
  maximum_grl_strength: 0.1
  grl_schedule_coefficient: 10.0
  entropy_conditioning: false
  detach_features: false
  detach_probabilities: false
discriminator:
  input_dimension: 3584
  hidden_dimension: 256
  activation: relu
  dropout_probability: 0.5
  number_of_outputs: 2
checkpoint:
  filename: cdan_best.pt
